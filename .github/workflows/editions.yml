# Every edition's suite, side by side, on each push (docs/editions.md). The box keeps the
# commit gate (the edition worked on); this is the push gate, off the box.
name: Editions

on:
  push:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'No cache: build every setup and fetch every image, as a new checkout does'
        type: boolean
        default: false
  # Every Monday, with no cache: caches kept from green runs hid three fresh-checkout bugs once
  # (docs/mistakes.md, 2026-10-05).
  schedule:
    - cron: '0 2 * * 1'

# Reading other runs' jobs and logs (bin/already-judged.sh) needs actions: read.
permissions:
  contents: read
  actions: read

# A push to a branch whose run is still going takes its place: that run would be judged on a
# commit no longer the branch's, and its macOS jobs keep the next run's waiting. stage2's runs
# all finish: they keep the caches the branches read.
concurrency:
  group: editions-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage2' }}

jobs:
  # A commit fast-forwarded to stage2 was judged on its ci/ branch: stage2's run of it keeps its
  # setups and caches, which branches read, and skips the suites it would run again (#164).
  judged:
    name: Judged on a ci/ branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.verdict.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/stage2 ]; then
            bin/already-judged.sh "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "skip=false" | tee -a "$GITHUB_OUTPUT"
          fi

  # Each edition's suite on two runners (SHARD=k/2, bin/run-tests.sh): the classes that launch
  # images run in two lanes on each, and in two lanes on one runner they alone took 25 to 40
  # minutes. The job "whole" below reads the two as one suite.
  suite:
    name: Pharo ${{ matrix.edition }} (${{ matrix.shard }}/2)
    needs: judged
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: [ 10, 11, 12, 13, 14 ]
        shard: [ 1, 2 ]
    steps:
      # Whole history: Iceberg, which the sync and the fixtures find the checkout through,
      # refuses a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      - name: The launcher for live targets
        run: cc -O2 -o bin/pharo-debuggable bin/pharo-debuggable.c

      # The built setup: VMMaker's load is most of the time. Rebuilt when the recipe or the
      # baseline changes; the suite compiles the working copy into it anyway.
      - name: Setup from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      # The pinned images the tests download into resources/ on first use.
      - name: Test images from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      # The image SpurImageFromDumpTest writes from the setup's core: VMMaker's simulated snapshot,
      # some six minutes, the longest thing a run does. The latest kept is restored; the class's
      # own key (cacheKey: the core and the code the image depends on) says whether it holds, and
      # one that does not is written again. One a shard: each keeps what its own classes wrote.
      - name: Image written from the core, from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        uses: actions/cache@v4
        with:
          path: /tmp/polyphemus/*/cache/image-from-dump
          key: image-from-dump-${{ matrix.edition }}-${{ matrix.shard }}of2-${{ hashFiles('Polyphemus-Object.package/**', 'Polyphemus-Edition-Pharo*.package/**', 'Polyphemus-VMMaker-MemoryMap.package/**', 'Polyphemus-Tests.package/SpurImageFromDumpTest.class/**', 'Polyphemus-Tests.package/StackOfADumpTest.class/**', 'bin/ci-setup.sh') }}
          restore-keys: |
            image-from-dump-${{ matrix.edition }}-${{ matrix.shard }}of2-
            image-from-dump-${{ matrix.edition }}-

      # Our packages may replace only the VMMaker methods bin/vmmaker-replaced.txt lists, which
      # only shrinks (#118): each edition's VMMaker is checked against its own source.
      - name: No VMMaker method replaced beyond the list
        run: python3 bin/vmmaker-replaced.py ~/setup/pharo-local/iceberg/pharo-project/pharo-vm/smalltalksrc . ${{ matrix.edition }}

      - name: Suite
        if: needs.judged.outputs.skip != 'true'
        run: |
          ln -sfn "$GITHUB_WORKSPACE" ~/setup/Polyphemus
          # Some runs are stopped from outside 6 to 9 minutes in (exit 143, no log kept). The
          # runner's memory, as annotations: they are kept, and public, even when the job is not.
          # Above 8 GB, which class each Pharo runs and how big it is (GitHub keeps ten notices a step).
          ( while sleep 20; do used=$(free -m | awk 'NR==2 {print $3}'); [ "$used" -gt 8000 ] && echo "::notice title=memory::$used MB used: $(ps -C pharo -o rss=,args= | sed -nE 's/^ *([0-9]+) .*polyphemus-run-[a-z0-9]+-([A-Za-z0-9]+)\.st.*/\2 \1/p' | awk '{printf "%s %d MB, ", $1, $2/1024}')"; done ) &
          # No timings yet on a fresh runner: a class gets TMO seconds, not three times its last run.
          # Two classes at once: with their targets, four took 14 of the runner's 16 GB and three
          # 15.9, and the step was killed from outside, leaving no log (exit 143, windows branch).
          SHARD=${{ matrix.shard }}/2 WORK=~/setup TMO=1800 bin/tdd.sh --all -j 2 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|FLAKY|NOTE|\|)|^== shard|totals|BROKEN|TIMEOUT" suite.log || true
          # Flakes and failures as annotations, kept and public: bin/flakes.sh counts them (#31).
          bin/annotate-results.sh ~/setup/.test-results
          # Not green on what it did not run (#164): this shard ran classes of its own and tests;
          # that the two hold the whole suite, and as much as it is known to run, is "whole"'s to say.
          # (No totals line spelled out here: this script is echoed into the job's log, where
          # bin/ci-verdict.sh would read it as the suite's.)
          grep -aqE "^== shard ${{ matrix.shard }}/2: [1-9][0-9]* of [1-9][0-9]* classes ==" suite.log || { echo "!! the shard ran no class of its own"; tail -60 suite.log; exit 1; }
          bin/check-totals.sh suite.log 1 1 || { echo "== end of the log =="; tail -60 suite.log; exit 1; }
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      # A VM someone else started, not through bin/pharo-debuggable: Yama refuses it to the
      # runner's user, and root reads it, as on macOS. The runner gives sudo without a password.
      - name: As root, a VM started by someone else
        if: matrix.shard == 1 && needs.judged.outputs.skip != 'true'
        run: |
          sudo WORK="$HOME/setup" TMO=1800 bin/run-tests.sh -c LinuxRootObserverTest 2>&1 | tee root.log | grep -aE "^RES|^    (FAIL|ERROR)" || true
          [ "$(grep -ac "^RES " root.log)" -eq 1 ] || { echo "!! the class did not answer"; exit 1; }
          ! grep -aE "^RES .*(BROKEN| [1-9][0-9]* (failures|errors))" root.log

      - name: Keep the core when the suite fails
        if: failure() && needs.judged.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-pharo-${{ matrix.edition }}-${{ matrix.shard }}
          path: ~/setup/pharo.core
          retention-days: 5

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-pharo-${{ matrix.edition }}-${{ matrix.shard }}
          path: |
            suite.log
            root.log
            ~/setup/load.log
            ~/setup/.class-logs

      # The suite log alone, for "whole" to read the shards as one.
      - name: Hand the shard's log on
        if: always() && needs.judged.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shard-pharo-${{ matrix.edition }}-${{ matrix.shard }}
          path: suite.log
          retention-days: 5

  # Each edition's two shards read as one suite (bin/check-shards.sh): both ended, every class
  # in one of them and none in both, and as many classes and tests, skipped ones not counted, as
  # an edition is known to run (#164). It runs whatever the shards said, to say what is missing.
  whole:
    name: Every edition, its shards as one suite
    needs: [ judged, suite ]
    if: ${{ always() && needs.judged.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-pharo-*
          path: shards
      - name: Each edition's shards, as one suite
        run: |
          bad=0
          for edition in 10 11 12 13 14; do
            echo "== Pharo $edition"
            mkdir -p "edition-$edition"
            for log in shards/shard-pharo-$edition-*/suite.log; do
              [ -f "$log" ] && cp "$log" "edition-$edition/$(basename "$(dirname "$log")").log"
            done
            bin/check-shards.sh "edition-$edition" 134 1000 || bad=1
          done
          exit $bad

  # macOS on Apple silicon, every edition (docs/handover-macos.md): the suite, then the tests that
  # read another process through its task port, which macOS grants a stock VM's observer only
  # as root. The runner gives sudo without a password.
  macos:
    name: macOS Pharo ${{ matrix.edition }}
    needs: judged
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Not 11: its VM, 10.0.5, dies at start on macOS 15, its stack pages wanted at a fixed
        # address already taken (2026-10-14, #80).
        edition: [ 10, 12, 13, 14 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-macos-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      - name: Test images from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-macos-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        if: needs.judged.outputs.skip != 'true'
        run: |
          ln -sfn "$GITHUB_WORKSPACE" ~/setup/Polyphemus
          # No lanes: the classes that launch images skip here without root, and two lanes kept
          # for them left the rest one class at a time (-j 3 less two). Two at once: the runner
          # has 7 GB, a class's image near 2.
          SERIAL_LANES=0 WORK=~/setup TMO=1800 bin/tdd.sh --all -j 2 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|FLAKY|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          # Flakes and failures as annotations, kept and public: bin/flakes.sh counts them (#31).
          bin/annotate-results.sh ~/setup/.test-results
          # Not green on what it did not run: classes answered, tests run but not skipped (#164).
          bin/check-totals.sh suite.log 136 800 || { echo "== end of the log =="; tail -60 suite.log; exit 1; }
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      # Not on Pharo 10 for now: macOS's VM 9 keeps new space apart from old space and its
      # heap does not read as Linux's VM 9 does (#80). Its suite runs.
      - name: As root, reading other processes
        if: matrix.edition != 10 && needs.judged.outputs.skip != 'true'
        run: |
          csrutil status || true
          for class in MacProcessMemoryTest MacStuckReportTest MacHoldTest MacMCPToolsTest; do
            sudo WORK="$HOME/setup" TMO=1800 bin/run-tests.sh -c "$class" 2>&1 | tee -a root.log | grep -aE "^RES|^    (FAIL|ERROR)" || true
          done
          [ "$(grep -ac "^RES " root.log)" -eq 4 ] || { echo "!! not every class answered"; exit 1; }
          ! grep -aE "^RES .*(BROKEN| [1-9][0-9]* (failures|errors))" root.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-macos-pharo-${{ matrix.edition }}
          path: |
            suite.log
            root.log
            ~/setup/load.log
            ~/setup/.class-logs

  # Windows x64, Pharo 13 (docs/handover-windows.md), natively rather than in WSL. Git Bash runs
  # the same scripts; the checkout is linked into the setup by a junction, not a symbolic link.
  windows:
    name: Windows Pharo ${{ matrix.edition }}
    needs: judged
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        edition: [ 13 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-windows-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      - name: Test images from cache
        if: ${{ github.event_name != 'schedule' && !inputs.fresh }}
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-windows-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        if: needs.judged.outputs.skip != 'true'
        run: |
          [ -e ~/setup/Polyphemus ] && cmd //c "rmdir $(cygpath -w ~/setup/Polyphemus)"
          cmd //c "mklink /J $(cygpath -w ~/setup/Polyphemus) $(cygpath -w "$GITHUB_WORKSPACE")" > /dev/null
          # No lanes: the classes that launch images skip here, and two lanes kept for them left
          # the rest one class at a time (-j 3 less two).
          SERIAL_LANES=0 WORK=~/setup TMO=1800 bin/tdd.sh --all -j 3 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|FLAKY|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          # Flakes and failures as annotations, kept and public: bin/flakes.sh counts them (#31).
          bin/annotate-results.sh ~/setup/.test-results
          # The logs where upload-artifact finds them: not behind ~ or the junction.
          mkdir -p logs && cp ~/setup/load.log logs/ && cp -r ~/setup/.class-logs logs/class-logs 2>/dev/null || true
          # Not green on what it did not run: classes answered, tests run but not skipped (#164).
          bin/check-totals.sh suite.log 133 820 || { echo "== end of the log =="; tail -60 suite.log; exit 1; }
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-windows-pharo-${{ matrix.edition }}
          if-no-files-found: warn
          path: |
            suite.log
            logs
