# Every edition's suite, side by side, on each push (docs/editions.md). The box keeps the
# commit gate (the edition worked on); this is the push gate, off the box.
name: Editions

on:
  push:
  workflow_dispatch:

jobs:
  suite:
    name: Pharo ${{ matrix.edition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: [ 10, 11, 12, 13, 14 ]
    steps:
      # Whole history: Iceberg, which the sync and the fixtures find the checkout through,
      # refuses a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      - name: The launcher for live targets
        run: cc -O2 -o bin/pharo-debuggable bin/pharo-debuggable.c

      # The built setup: VMMaker's load is most of the time. Rebuilt when the recipe or the
      # baseline changes; the suite compiles the working copy into it anyway.
      - name: Setup from cache
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      # The pinned images the tests download into resources/ on first use.
      - name: Test images from cache
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        run: |
          ln -sfn "$GITHUB_WORKSPACE" ~/setup/Polyphemus
          # No timings yet on a fresh runner: a class gets TMO seconds, not three times its last run.
          WORK=~/setup TMO=1800 bin/tdd.sh --all -j 4 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      - name: Keep the core when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-pharo-${{ matrix.edition }}
          path: ~/setup/pharo.core
          retention-days: 5

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-pharo-${{ matrix.edition }}
          path: |
            suite.log
            ~/setup/load.log
            ~/setup/.class-logs

  # macOS on Apple silicon, every edition (docs/handover-macos.md): the suite, then the tests that
  # read another process through its task port, which macOS grants a stock VM's observer only
  # as root. The runner gives sudo without a password.
  macos:
    name: macOS Pharo ${{ matrix.edition }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Not 11: its VM, 10.0.5, dies at start on macOS 15, its stack pages wanted at a fixed
        # address already taken (2026-10-14, #80).
        edition: [ 10, 12, 13, 14 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup from cache
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-macos-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      - name: Test images from cache
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-macos-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        run: |
          ln -sfn "$GITHUB_WORKSPACE" ~/setup/Polyphemus
          WORK=~/setup TMO=1800 bin/tdd.sh --all -j 3 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      # Not on Pharo 10 for now: macOS's VM 9 keeps new space apart from old space and its
      # heap does not read as Linux's VM 9 does (#80). Its suite runs.
      - name: As root, reading other processes
        if: matrix.edition != 10
        run: |
          csrutil status || true
          for class in MacProcessMemoryTest MacStuckReportTest MacHoldTest MacMCPToolsTest; do
            sudo WORK="$HOME/setup" TMO=1800 bin/run-tests.sh -c "$class" 2>&1 | tee -a root.log | grep -aE "^RES|^    (FAIL|ERROR)" || true
          done
          [ "$(grep -ac "^RES " root.log)" -eq 4 ] || { echo "!! not every class answered"; exit 1; }
          ! grep -aE "^RES .*(BROKEN| [1-9][0-9]* (failures|errors))" root.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-macos-pharo-${{ matrix.edition }}
          path: |
            suite.log
            root.log
            ~/setup/load.log
            ~/setup/.class-logs
