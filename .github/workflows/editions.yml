# Every edition's suite, side by side, on each push (docs/editions.md). The box keeps the
# commit gate (the edition worked on); this is the push gate, off the box.
name: Editions

on:
  push:
  workflow_dispatch:

jobs:
  suite:
    name: Pharo ${{ matrix.edition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: [ 10, 11, 12, 13, 14 ]
    steps:
      # Whole history: Iceberg, which the sync and the fixtures find the checkout through,
      # refuses a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      - name: The launcher for live targets
        run: cc -O2 -o bin/pharo-debuggable bin/pharo-debuggable.c

      # The built setup: VMMaker's load is most of the time. Rebuilt when the recipe or the
      # baseline changes; the suite compiles the working copy into it anyway.
      - name: Setup from cache
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      # The pinned images the tests download into resources/ on first use.
      - name: Test images from cache
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        run: |
          ln -sfn "$GITHUB_WORKSPACE" ~/setup/Polyphemus
          # Some runs are stopped from outside 6 to 9 minutes in (exit 143, no log kept). The
          # runner's memory, as annotations: they are kept, and public, even when the job is not.
          # Above 8 GB, which class each Pharo runs and how big it is (GitHub keeps ten notices a step).
          ( while sleep 20; do used=$(free -m | awk 'NR==2 {print $3}'); [ "$used" -gt 8000 ] && echo "::notice title=memory::$used MB used: $(ps -C pharo -o rss=,args= | sed -nE 's/^ *([0-9]+) .*polyphemus-run-[a-z0-9]+-([A-Za-z0-9]+)\.st.*/\2 \1/p' | awk '{printf "%s %d MB, ", $1, $2/1024}')"; done ) &
          # No timings yet on a fresh runner: a class gets TMO seconds, not three times its last run.
          # Two classes at once: with their targets, four took 14 of the runner's 16 GB and three
          # 15.9, and the step was killed from outside, leaving no log (exit 143, windows branch).
          WORK=~/setup TMO=1800 bin/tdd.sh --all -j 2 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|FLAKY|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          # Flakes and failures as annotations, kept and public: bin/flakes.sh counts them (#31).
          bin/annotate-results.sh ~/setup/.test-results
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      # A VM someone else started, not through bin/pharo-debuggable: Yama refuses it to the
      # runner's user, and root reads it, as on macOS. The runner gives sudo without a password.
      - name: As root, a VM started by someone else
        run: |
          sudo WORK="$HOME/setup" TMO=1800 bin/run-tests.sh -c LinuxRootObserverTest 2>&1 | tee root.log | grep -aE "^RES|^    (FAIL|ERROR)" || true
          [ "$(grep -ac "^RES " root.log)" -eq 1 ] || { echo "!! the class did not answer"; exit 1; }
          ! grep -aE "^RES .*(BROKEN| [1-9][0-9]* (failures|errors))" root.log

      - name: Keep the core when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-pharo-${{ matrix.edition }}
          path: ~/setup/pharo.core
          retention-days: 5

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-pharo-${{ matrix.edition }}
          path: |
            suite.log
            root.log
            ~/setup/load.log
            ~/setup/.class-logs

  # macOS on Apple silicon, every edition (docs/handover-macos.md): the suite, then the tests that
  # read another process through its task port, which macOS grants a stock VM's observer only
  # as root. The runner gives sudo without a password.
  macos:
    name: macOS Pharo ${{ matrix.edition }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Not 11: its VM, 10.0.5, dies at start on macOS 15, its stack pages wanted at a fixed
        # address already taken (2026-10-14, #80).
        edition: [ 10, 12, 13, 14 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup from cache
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-macos-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      - name: Test images from cache
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-macos-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        run: |
          ln -sfn "$GITHUB_WORKSPACE" ~/setup/Polyphemus
          WORK=~/setup TMO=1800 bin/tdd.sh --all -j 3 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|FLAKY|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          # Flakes and failures as annotations, kept and public: bin/flakes.sh counts them (#31).
          bin/annotate-results.sh ~/setup/.test-results
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      # Not on Pharo 10 for now: macOS's VM 9 keeps new space apart from old space and its
      # heap does not read as Linux's VM 9 does (#80). Its suite runs.
      - name: As root, reading other processes
        if: matrix.edition != 10
        run: |
          csrutil status || true
          for class in MacProcessMemoryTest MacStuckReportTest MacHoldTest MacMCPToolsTest; do
            sudo WORK="$HOME/setup" TMO=1800 bin/run-tests.sh -c "$class" 2>&1 | tee -a root.log | grep -aE "^RES|^    (FAIL|ERROR)" || true
          done
          [ "$(grep -ac "^RES " root.log)" -eq 4 ] || { echo "!! not every class answered"; exit 1; }
          ! grep -aE "^RES .*(BROKEN| [1-9][0-9]* (failures|errors))" root.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-macos-pharo-${{ matrix.edition }}
          path: |
            suite.log
            root.log
            ~/setup/load.log
            ~/setup/.class-logs

  # Windows x64, Pharo 13 (docs/handover-windows.md), natively rather than in WSL. Git Bash runs
  # the same scripts; the checkout is linked into the setup by a junction, not a symbolic link.
  windows:
    name: Windows Pharo ${{ matrix.edition }}
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        edition: [ 13 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup from cache
        id: setup
        uses: actions/cache@v4
        with:
          path: ~/setup
          key: setup-windows-${{ matrix.edition }}-${{ hashFiles('bin/ci-setup.sh', 'BaselineOfPolyphemus.package/**') }}

      - name: Build the setup
        if: steps.setup.outputs.cache-hit != 'true'
        run: bin/ci-setup.sh ${{ matrix.edition }} ~/setup

      - name: Test images from cache
        uses: actions/cache@v4
        with:
          path: |
            resources/*.image
            resources/*.changes
            resources/*.sources
            !resources/candle64Bit.image
          key: images-windows-${{ hashFiles('Polyphemus-Helper.package/PharoImageAccessor.class/class/downloadNameForPharo..st', 'Polyphemus-Helper.package/PharoImageAccessor.class/class/sourcesNameForPharo..st') }}

      - name: Suite
        run: |
          [ -e ~/setup/Polyphemus ] && cmd //c "rmdir $(cygpath -w ~/setup/Polyphemus)"
          cmd //c "mklink /J $(cygpath -w ~/setup/Polyphemus) $(cygpath -w "$GITHUB_WORKSPACE")" > /dev/null
          WORK=~/setup TMO=1800 bin/tdd.sh --all -j 3 > suite.log 2>&1 || true
          grep -aE "^RES|^    (FAIL|ERROR|FLAKY|NOTE|\|)|totals|BROKEN|TIMEOUT" suite.log || true
          # Flakes and failures as annotations, kept and public: bin/flakes.sh counts them (#31).
          bin/annotate-results.sh ~/setup/.test-results
          # The logs where upload-artifact finds them: not behind ~ or the junction.
          mkdir -p logs && cp ~/setup/load.log logs/ && cp -r ~/setup/.class-logs logs/class-logs 2>/dev/null || true
          # A suite that ran nothing is not green: every class answers with a RES line.
          [ "$(grep -ac "^RES " suite.log)" -ge 90 ] || { echo "!! fewer than 90 classes answered"; tail -60 suite.log; exit 1; }
          grep -q "totals: .* 0 failures, 0 errors, 0 broken" suite.log || { echo "== end of the log =="; tail -60 suite.log; exit 1; }

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-windows-pharo-${{ matrix.edition }}
          if-no-files-found: warn
          path: |
            suite.log
            logs
